<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Cache Buster Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>ئۇيغۇر كىنو - Telegram Mini App</title>

    <!-- Telegram Web App SDK JavaScript Library -->
    <script src="https://telegram.org/js/telegram-web-app.js?v=2.0"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #e50914;
            --tg-theme-bg: #0f0f0f;
            --card-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --nav-bg: #161618;
            --border-color: #2c2c2e;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--tg-theme-bg);
            color: var(--text-color);
            direction: rtl;
            padding-bottom: 70px;
            user-select: none;
        }

        /* Outside Access Screen */
        #telegramOnlyOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0f0f;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #telegramOnlyOverlay i { font-size: 60px; color: #40c4ff; margin-bottom: 15px; }
        #telegramOnlyOverlay h2 { font-size: 18px; margin-bottom: 10px; }
        #telegramOnlyOverlay p { font-size: 13px; color: var(--text-muted); }

        /* App Header */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* User Profile Display Banner (Only Name & Avatar) */
        .user-card {
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            padding: 12px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .user-avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        .user-avatar-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            font-weight: bold;
        }

        .user-details h4 { font-size: 15px; font-weight: 700; }

        /* Views System */
        .app-view {
            display: none;
            padding: 16px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .app-view.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            font-size: 15px;
            font-weight: 700;
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Movie Layout */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .movie-card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            display: block;
        }

        .movie-card-info { padding: 8px; }

        .movie-card-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Admin Forms */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Clickable User Item in Admin Panel */
        .users-list {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 10px;
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
        }

        .user-item-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
        }

        .user-item-card:hover, .user-item-card:active {
            background: #2c2c2e;
        }

        .user-item-card:last-child { border-bottom: none; }

        .user-item-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-item-placeholder {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .user-item-info { flex: 1; }
        .user-item-info strong { font-size: 13px; color: #fff; display: block; }
        .user-item-info span { font-size: 11px; color: #40c4ff; }
        .user-item-info small { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }

        /* Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary-color); }
        .admin-nav-item { display: none; }

        /* Player Modal */
        .player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
        }

        .player-header {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.8);
        }

        .player-body { flex: 1; }
        .player-body iframe { width: 100%; height: 100%; border: none; }
        .btn-close { color: #fff; font-size: 20px; background: none; border: none; }
    </style>
</head>
<body>

    <!-- Telegram Outside Access Overlay -->
    <div id="telegramOnlyOverlay">
        <i class="fa-brands fa-telegram"></i>
        <h2>كىرىش چەكلەندى</h2>
        <p>بۇ بەتنى پەقەت Telegram Mini App ئىچىدىلا ئاچقىلى بولىدۇ.</p>
    </div>

    <!-- Main App Container -->
    <div id="appContainer">
        <!-- App Header -->
        <div class="app-header">
            <div class="app-title">
                <i class="fa-solid fa-play-circle"></i> ئۇيغۇر كىنو Mini App
            </div>
            <div style="font-size: 11px; color: #40c4ff;">
                <i class="fa-brands fa-telegram"></i> Telegram
            </div>
        </div>

        <!-- 1. Home View -->
        <div id="homeView" class="app-view active">
            <!-- Current User Profile Display (Only Name & Avatar) -->
            <div class="user-card" id="userProfileCard">
                <div id="uAvatarContainer"></div>
                <div class="user-details">
                    <h4 id="uName">ئىشلەتكۈچى</h4>
                </div>
            </div>

            <div class="section-header">
                <span>يېڭى قوشۇلغان فىلىملەر</span>
            </div>
            <div class="movie-grid" id="homeMovieList"></div>
        </div>

        <!-- 2. Search View -->
        <div id="searchView" class="app-view">
            <div class="form-group">
                <input type="text" id="searchInput" class="form-control" placeholder="كىنو ئىسمىنى ئىزدەڭ..." onkeyup="handleSearch()">
            </div>
            <div class="movie-grid" id="searchMovieList"></div>
        </div>

        <!-- 3. Admin View -->
        <div id="adminView" class="app-view">
            <div class="section-header">
                <span><i class="fa-solid fa-film"></i> يېڭى فىلىم قوشۇش</span>
            </div>
            <form id="addMovieForm" onsubmit="saveMovie(event)">
                <div class="form-group">
                    <label>فىلىم ئىسمى</label>
                    <input type="text" id="movieTitle" class="form-control" placeholder="فىلىم نامى" required>
                </div>
                <div class="form-group">
                    <label>فىلىم رەسىمى (Image URL)</label>
                    <input type="url" id="moviePoster" class="form-control" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Archive.org ئۇلانمىسى</label>
                    <input type="url" id="movieArchiveUrl" class="form-control" placeholder="https://archive.org/details/..." required>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> فىلىم ئېلان قىلىش</button>
            </form>

            <!-- User List Table for Admin -->
            <div class="section-header" style="margin-top: 25px;">
                <span><i class="fa-solid fa-users"></i> كىرگەن ئابونتلار (<span id="userCount">0</span>)</span>
            </div>
            <p style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">* ئابونتنى باسسىڭىز ئۇنىڭ Profile كۆزنىكى ئېچىلىدۇ</p>
            <div class="users-list" id="registeredUsersContainer"></div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchView('homeView', this)">
                <i class="fa-solid fa-house"></i>
                <span>ئاساسىي</span>
            </div>
            <div class="nav-item" onclick="switchView('searchView', this)">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>ئىزدەش</span>
            </div>
            <!-- Admin Nav Item -->
            <div class="nav-item admin-nav-item" id="adminNavItem" onclick="switchView('adminView', this)">
                <i class="fa-solid fa-user-shield"></i>
                <span>باشقۇرۇش</span>
            </div>
        </div>
    </div>

    <!-- Video Player Screen -->
    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span id="playerTitle" style="font-size: 13px; font-weight: 600;"></span>
            <button class="btn-close" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="player-body" id="playerContainer"></div>
    </div>

    <script>
        // 🔑 باشقۇرغۇچى Telegram ID نومۇرىڭىز
        const ADMIN_TELEGRAM_ID = "8739045571"; 

        const tg = window.Telegram?.WebApp;
        let currentUser = null;

        function initApp() {
            // Telegram Mini App تەستىقلاش
            if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                document.getElementById('telegramOnlyOverlay').style.display = 'flex';
                document.getElementById('appContainer').style.display = 'none';
                return;
            }

            tg.ready();
            tg.expand();

            currentUser = tg.initDataUnsafe.user;

            // ئابونت كىرگەن ھامان ئاپتوماتىك تەپسىلاتلىرىنى ساقلاش
            autoRegisterUser(currentUser);

            // ئاساسىي كۆرۈنمىدە پەقەت ئىسمى ۋە رەسىمىلا كۆرۈنىدۇ (ID يوشۇرۇلدى)
            const fullName = `${currentUser.first_name || ''} ${currentUser.last_name || ''}`.trim();
            document.getElementById('uName').innerText = fullName || 'ئىشلەتكۈچى';
            
            const avatarBox = document.getElementById('uAvatarContainer');
            if (currentUser.photo_url) {
                avatarBox.innerHTML = `<img src="${currentUser.photo_url}" class="user-avatar-img">`;
            } else {
                avatarBox.innerHTML = `<div class="user-avatar-placeholder">${(currentUser.first_name || 'U').charAt(0).toUpperCase()}</div>`;
            }

            // پەقەت باشقۇرغۇچىگىلا Menyus ئېچىلىدۇ
            if (String(currentUser.id) === String(ADMIN_TELEGRAM_ID)) {
                document.getElementById('adminNavItem').style.display = 'flex';
            }

            renderHomeMovies();
        }

        // ئابونتلارنىڭ تەپسىلىي ئۇچۇرلىرىنى ساقلاش
        function autoRegisterUser(user) {
            let users = JSON.parse(localStorage.getItem('uyghur_tg_users')) || [];
            const existingIndex = users.findIndex(u => String(u.id) === String(user.id));

            const now = new Date();
            const timeFormatted = now.toLocaleDateString('ug') + ' ' + now.toLocaleTimeString('ug', {hour: '2-digit', minute:'2-digit'});

            const userDataObj = {
                id: user.id,
                name: `${user.first_name || ''} ${user.last_name || ''}`.trim(),
                username: user.username ? user.username : '',
                photo_url: user.photo_url || null,
                date: timeFormatted
            };

            if (existingIndex > -1) {
                users[existingIndex] = userDataObj;
            } else {
                users.unshift(userDataObj);
            }

            localStorage.setItem('uyghur_tg_users', JSON.stringify(users));
        }

        // Default Movies
        const defaultMovies = [
            {
                id: 1,
                title: "ئالەم ئارا ساياھەت",
                poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80",
                archiveUrl: "https://archive.org/embed/Popeye_for_President"
            }
        ];

        function getMovies() {
            const saved = localStorage.getItem('uyghur_movies');
            return saved ? JSON.parse(saved) : defaultMovies;
        }

        function switchView(viewId, navElement) {
            if (viewId === 'adminView' && String(currentUser?.id) !== String(ADMIN_TELEGRAM_ID)) {
                alert('سىزنىڭ باشقۇرۇش ھوقۇقىڭىز يوق!');
                return;
            }

            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');
            if(navElement) navElement.classList.add('active');

            if(viewId === 'homeView') renderHomeMovies();
            if(viewId === 'adminView') renderAdminUserList();
        }

        function renderHomeMovies() {
            const movies = getMovies();
            const container = document.getElementById('homeMovieList');
            container.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.title, movie.archiveUrl);
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // باشقۇرغۇچى پانيېلىدا ئابونتنى باسسا Profile كۆزنىكى ئېچىلىدۇ
        function renderAdminUserList() {
            const users = JSON.parse(localStorage.getItem('uyghur_tg_users')) || [];
            const container = document.getElementById('registeredUsersContainer');
            document.getElementById('userCount').innerText = users.length;
            container.innerHTML = '';

            if(users.length === 0) {
                container.innerHTML = `<p style="font-size:12px; color:var(--text-muted); padding:10px;">ھېچقانداق ئىشلەتكۈچى كىرمىدى</p>`;
                return;
            }

            users.forEach(u => {
                const item = document.createElement('div');
                item.className = 'user-item-card';
                
                // ئابونتنى باسقاندا Profile كۆزنىكىنى ئېچىش
                item.onclick = () => openUserChat(u);

                const avatarHtml = u.photo_url 
                    ? `<img src="${u.photo_url}" class="user-item-avatar">` 
                    : `<div class="user-item-placeholder">${(u.name || 'U').charAt(0).toUpperCase()}</div>`;

                const displayUsername = u.username ? `@${u.username}` : 'Username يوق';

                item.innerHTML = `
                    ${avatarHtml}
                    <div class="user-item-info">
                        <strong>${u.name}</strong>
                        <span>${displayUsername}</span>
                        <small>كەلگەن ۋاقتى: ${u.date}</small>
                    </div>
                    <div style="color:#40c4ff; font-size:16px;">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Telegram Profile كۆزنىكىنى ئېچىش
        function openUserChat(user) {
            if (user.username && user.username !== '') {
                tg.openTelegramLink(`https://t.me/${user.username}`);
            } else if (user.id) {
                tg.openTelegramLink(`https://t.me/user?id=${user.id}`);
            }
        }

        function saveMovie(e) {
            e.preventDefault();
            const title = document.getElementById('movieTitle').value;
            const poster = document.getElementById('moviePoster').value;
            let archiveUrl = document.getElementById('movieArchiveUrl').value;

            if(archiveUrl.includes('archive.org/details/')) {
                archiveUrl = archiveUrl.replace('/details/', '/embed/');
            }

            const movies = getMovies();
            movies.unshift({ id: Date.now(), title, poster, archiveUrl });
            localStorage.setItem('uyghur_movies', JSON.stringify(movies));

            document.getElementById('addMovieForm').reset();
            alert('فىلىم مۇۋەپپەقىيەتلىك ئېلان قىلىندى!');
            switchView('homeView', document.querySelectorAll('.nav-item')[0]);
        }

        function playMovie(title, url) {
            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            document.getElementById('playerTitle').innerText = title;

            let embedUrl = url;
            if(embedUrl.includes('archive.org/details/')) {
                embedUrl = embedUrl.replace('/details/', '/embed/');
            }

            container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            modal.style.display = 'flex';
        }

        function closeVideo() {
            const modal = document.getElementById('playerModal');
            document.getElementById('playerContainer').innerHTML = '';
            modal.style.display = 'none';
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const movies = getMovies();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(query));
            
            const container = document.getElementById('searchMovieList');
            container.innerHTML = '';

            filtered.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.title, movie.archiveUrl);
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
