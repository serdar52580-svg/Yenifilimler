<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Cache Buster Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>ئۇيغۇر كىنو - Telegram Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js?v=3.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #e50914;
            --vip-color: #ffd700;
            --tg-theme-bg: #0f0f0f;
            --card-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --nav-bg: #161618;
            --border-color: #2c2c2e;
            --radius: 12px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--tg-theme-bg);
            color: var(--text-color);
            direction: rtl;
            padding-bottom: 70px;
            user-select: none;
        }

        #telegramOnlyOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 15, 15, 0.98);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #telegramOnlyOverlay i { font-size: 60px; color: #40c4ff; margin-bottom: 15px; }
        #telegramOnlyOverlay h2 { font-size: 18px; margin-bottom: 10px; }
        #telegramOnlyOverlay p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

        .btn-join-channel {
            display: inline-block; background: #24A1DE; color: white;
            padding: 12px 24px; border-radius: 8px; font-weight: bold;
            font-size: 14px; cursor: pointer; border: none; margin-top: 10px; width: 100%; max-width: 280px;
        }

        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 15, 15, 0.95); padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .app-title { font-size: 17px; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }

        .user-card {
            background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
            padding: 12px; border-radius: var(--radius);
            display: flex; align-items: center; gap: 12px; margin-bottom: 16px; border: 1px solid var(--border-color);
        }

        .user-avatar-img, .user-avatar-placeholder {
            width: 48px; height: 48px; border-radius: 50%;
        }
        .user-avatar-img { object-fit: cover; border: 2px solid var(--primary-color); }
        .user-avatar-placeholder { background: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; font-weight: bold; }

        .user-details h4 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .vip-badge-tag { background: linear-gradient(45deg, #ffd700, #ff9800); color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .app-view { display: none; padding: 16px; }
        .app-view.active { display: block; }

        .section-header { font-size: 15px; font-weight: 700; margin: 15px 0 10px 0; }

        .movie-grid, .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px;
        }
        .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

        .movie-card, .gallery-card {
            background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; position: relative;
        }
        .movie-card img, .gallery-card img { width: 100%; height: 145px; object-fit: cover; display: block; }
        .gallery-card img { height: 150px; }
        .movie-card-info, .gallery-card-title { padding: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .gallery-card-title { font-size: 11px; color: #ddd; text-align: center; }

        .movie-badge-vip { position: absolute; top: 6px; right: 6px; background: linear-gradient(45deg, #ffd700, #ff9800); color: #000; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .movie-badge-free { position: absolute; top: 6px; right: 6px; background: #4caf50; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px 12px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .btn-submit { width: 100%; padding: 12px; background: var(--primary-color); border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px; }

        .users-list { background: var(--card-bg); border-radius: var(--radius); padding: 10px; margin-top: 15px; max-height: 350px; overflow-y: auto; }
        .user-item-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-color); border-radius: 8px; }
        .user-item-avatar, .user-item-placeholder { width: 42px; height: 42px; border-radius: 50%; }
        .user-item-avatar { object-fit: cover; }
        .user-item-placeholder { background: #333; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 16px; }
        .user-item-info { flex: 1; }
        .user-item-info strong { font-size: 13px; color: #fff; display: block; }
        .user-item-info span { font-size: 11px; color: #40c4ff; }
        .btn-vip-toggle { background: #ff9800; color: #000; border: none; padding: 5px 10px; font-size: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 160px); background: var(--card-bg); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-color); }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg-item { display: flex; gap: 10px; align-items: flex-start; max-width: 85%; }
        .chat-msg-item.my-msg { align-self: flex-end; flex-direction: row-reverse; }
        .chat-msg-avatar, .chat-msg-avatar-ph { width: 32px; height: 32px; border-radius: 50%; }
        .chat-msg-avatar { object-fit: cover; }
        .chat-msg-avatar-ph { background: var(--primary-color); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; font-weight: bold; }
        .chat-msg-body { background: #2c2c2e; padding: 8px 12px; border-radius: 12px; }
        .chat-msg-item.my-msg .chat-msg-body { background: #e50914; }
        .chat-msg-author { font-size: 11px; font-weight: bold; color: #40c4ff; margin-bottom: 2px; }
        .chat-msg-item.my-msg .chat-msg-author { color: #ffeb3b; text-align: left; }
        .chat-msg-text { font-size: 13px; word-break: break-word; }
        .chat-msg-time { font-size: 9px; color: var(--text-muted); margin-top: 4px; text-align: left; }
        .chat-input-bar { padding: 8px 10px; background: #161618; display: flex; gap: 8px; border-top: 1px solid var(--border-color); }
        .chat-input-bar input { flex: 1; padding: 10px; background: #2c2c2e; border: none; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .chat-input-bar button { background: var(--primary-color); border: none; color: #fff; padding: 0 16px; border-radius: 8px; cursor: pointer; font-size: 16px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
            background: var(--nav-bg); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; gap: 4px; cursor: pointer; flex: 1; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: var(--primary-color); }
        .admin-nav-item { display: none; }

        .player-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; justify-content: flex-start; }
        .player-header { width: 100%; padding: 12px; display: flex; justify-content: space-between; background: rgba(0,0,0,0.8); }
        .player-body { width: 100%; flex: 1; }
        .player-body iframe { width: 100%; height: 100%; border: none; }
        .btn-close { color: #fff; font-size: 20px; background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="telegramOnlyOverlay">
        <i class="fa-brands fa-telegram"></i>
        <h2>كىنو قانىلىمىزغا ئەزا بولۇڭ</h2>
        <p>فىلىملەرنى كۆرۈش ئۈچۈن قانىلىمىزغا ئەزا بولۇپ قويۇڭ!</p>
        <button class="btn-join-channel" onclick="openChannelLink()">قانالغا كىرىش (@xax9898)</button>
        <button class="btn-join-channel" style="background:#333; margin-top:10px;" onclick="closeChannelPrompt()">ئەزا بولدۇم (داۋاملاشتۇرۇش)</button>
    </div>

    <div id="appContainer">
        <div class="app-header">
            <div class="app-title"><i class="fa-solid fa-play-circle"></i> ئۇيغۇر كىنو Mini App</div>
            <div style="font-size: 11px; color: #40c4ff;"><i class="fa-brands fa-telegram"></i> Telegram</div>
        </div>

        <div id="homeView" class="app-view active">
            <div class="user-card">
                <div id="uAvatarContainer"></div>
                <div class="user-details">
                    <h4 id="uName">ئىشلەتكۈچى <span id="vipBadgeContainer"></span></h4>
                </div>
            </div>
            <div class="section-header">يېڭى قوشۇلغان فىلىملەر</div>
            <div class="movie-grid" id="homeMovieList"></div>
        </div>

        <div id="searchView" class="app-view">
            <div class="form-group">
                <input type="text" id="searchInput" class="form-control" placeholder="كىنو ئىسمىنى ئىزدەڭ..." oninput="handleSearch()">
            </div>
            <div class="movie-grid" id="searchMovieList"></div>
        </div>

        <div id="galleryView" class="app-view">
            <div class="section-header">رەسىملەر ئامبىرى</div>
            <div class="gallery-grid" id="galleryContainer"></div>
        </div>

        <div id="chatView" class="app-view">
            <div class="section-header">ئاممىۋى پاراڭلىشىش سورۇنى</div>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessageList"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInputText" placeholder="ئۇچۇرىڭىزنى يېزىڭ..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="adminView" class="app-view">
            <div class="section-header">توربەتكە فىلىم يوللاش</div>
            <form id="addMovieForm" onsubmit="saveMovie(event)">
                <div class="form-group"><label>فىلىم ئىسمى</label><input type="text" id="movieTitle" class="form-control" required></div>
                <div class="form-group"><label>فىلىم رەسىمى URL</label><input type="url" id="moviePoster" class="form-control" required></div>
                <div class="form-group"><label>Archive.org URL</label><input type="url" id="movieArchiveUrl" class="form-control" required></div>
                <div class="form-group"><label>فىلىم تۈرى</label>
                    <select id="movieType" class="form-control">
                        <option value="free">ھەقسىز</option>
                        <option value="vip">👑 VIP</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">توربەتكە فىلىم يوللاش</button>
            </form>

            <div class="section-header" style="margin-top: 25px;">يېڭى رەسىم يوللاش</div>
            <form id="addPhotoForm" onsubmit="savePhoto(event)">
                <div class="form-group"><label>رەسىم ماۋزۇسى</label><input type="text" id="photoTitle" class="form-control" required></div>
                <div class="form-group"><label>رەسىم URL</label><input type="url" id="photoUrl" class="form-control" required></div>
                <button type="submit" class="btn-submit" style="background:#2196f3;">رەسىم يوللاش</button>
            </form>

            <div class="section-header" style="margin-top: 25px;">كىرگەن ئابونتلار (<span id="userCount">0</span>)</div>
            <div class="users-list" id="registeredUsersContainer"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchView('homeView', this)"><i class="fa-solid fa-house"></i><span>ئاساسىي</span></div>
            <div class="nav-item" onclick="switchView('searchView', this)"><i class="fa-solid fa-magnifying-glass"></i><span>ئىزدەش</span></div>
            <div class="nav-item" onclick="switchView('galleryView', this)"><i class="fa-solid fa-images"></i><span>رەسىملەر</span></div>
            <div class="nav-item" onclick="switchView('chatView', this)"><i class="fa-solid fa-comments"></i><span>پاراڭلىشىش</span></div>
            <div class="nav-item admin-nav-item" id="adminNavItem" onclick="switchView('adminView', this)"><i class="fa-solid fa-user-shield"></i><span>باشقۇرۇش</span></div>
        </div>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span id="playerTitle" style="font-size: 13px; font-weight: 600;"></span>
            <button class="btn-close" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="player-body" id="playerContainer"></div>
    </div>

    <script>
        const ADMIN_TELEGRAM_ID = "8739045571";
        const BOT_USERNAME = "Uyghur98_bot";
        const tg = window.Telegram?.WebApp;
        let currentUser = null;

        function initApp() {
            try {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    currentUser = tg.initDataUnsafe.user;
                    tg.ready();
                    tg.expand();
                } else {
                    currentUser = { id: 8739045571, first_name: "باشقۇرغۇچى", username: "admin", photo_url: null };
                }

                autoRegisterUser(currentUser);

                const hasSeen = localStorage.getItem(`seen_prompt_${currentUser.id}`);
                const overlay = document.getElementById('telegramOnlyOverlay');
                if (!hasSeen && overlay) {
                    overlay.style.display = 'flex';
                } else if (overlay) {
                    overlay.style.display = 'none';
                }

                document.getElementById('uName').innerText = `${currentUser.first_name || 'ئىشلەتكۈچى'}`;
                checkVipStatusUI();

                const avatarBox = document.getElementById('uAvatarContainer');
                if (currentUser.photo_url) {
                    avatarBox.innerHTML = `<img src="${currentUser.photo_url}" class="user-avatar-img">`;
                } else {
                    avatarBox.innerHTML = `<div class="user-avatar-placeholder">${(currentUser.first_name || 'U').charAt(0).toUpperCase()}</div>`;
                }

                if (String(currentUser.id) === String(ADMIN_TELEGRAM_ID)) {
                    document.getElementById('adminNavItem').style.display = 'flex';
                }

                renderHomeMovies();
                renderGallery();
                renderChatMessages();
                renderAdminUserList();
            } catch(e) {
                console.error(e);
            }
        }

        function checkVipStatusUI() {
            const isVip = isUserVip(currentUser.id);
            const container = document.getElementById('vipBadgeContainer');
            if (container) container.innerHTML = isVip ? `<span class="vip-badge-tag">👑 VIP</span>` : '';
        }

        function isUserVip(userId) {
            if (String(userId) === String(ADMIN_TELEGRAM_ID)) return true;
            try {
                const vipUsers = JSON.parse(localStorage.getItem('uyghur_vip_users')) || [];
                return vipUsers.includes(String(userId));
            } catch(e) { return false; }
        }

        function toggleUserVipStatus(userId) {
            let vipUsers = JSON.parse(localStorage.getItem('uyghur_vip_users')) || [];
            const strId = String(userId);
            if (vipUsers.includes(strId)) {
                vipUsers = vipUsers.filter(id => id !== strId);
            } else {
                vipUsers.push(strId);
            }
            localStorage.setItem('uyghur_vip_users', JSON.stringify(vipUsers));
            renderAdminUserList();
        }

        function openChannelLink() {
            if (tg && tg.openTelegramLink) tg.openTelegramLink(`https://t.me/xax9898`);
            else window.open(`https://t.me/xax9898`, '_blank');
        }

        function closeChannelPrompt() {
            if (currentUser) localStorage.setItem(`seen_prompt_${currentUser.id}`, 'true');
            document.getElementById('telegramOnlyOverlay').style.display = 'none';
        }

        function autoRegisterUser(user) {
            if (!user || !user.id) return;
            let users = JSON.parse(localStorage.getItem('uyghur_tg_users')) || [];
            if (!users.some(u => String(u.id) === String(user.id))) {
                users.unshift({
                    id: user.id,
                    name: `${user.first_name || ''}`.trim(),
                    username: user.username || '',
                    photo_url: user.photo_url || null,
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('uyghur_tg_users', JSON.stringify(users));
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInputText');
            if (!input || !input.value.trim()) return;
            let chats = JSON.parse(localStorage.getItem('uyghur_app_chat')) || [];
            chats.push({
                id: Date.now(),
                userId: currentUser.id,
                name: currentUser.first_name,
                photo: currentUser.photo_url,
                text: input.value.trim(),
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
            localStorage.setItem('uyghur_app_chat', JSON.stringify(chats));
            input.value = '';
            renderChatMessages();
        }

        function renderChatMessages() {
            const container = document.getElementById('chatMessageList');
            if (!container) return;
            const chats = JSON.parse(localStorage.getItem('uyghur_app_chat')) || [];
            container.innerHTML = chats.map(c => `
                <div class="chat-msg-item ${String(c.userId) === String(currentUser?.id) ? 'my-msg' : ''}">
                    ${c.photo ? `<img src="${c.photo}" class="chat-msg-avatar">` : `<div class="chat-msg-avatar-ph">${c.name.charAt(0)}</div>`}
                    <div class="chat-msg-body">
                        <div class="chat-msg-author">${c.name}</div>
                        <div class="chat-msg-text">${c.text}</div>
                        <div class="chat-msg-time">${c.time}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function savePhoto(e) {
            e.preventDefault();
            const title = document.getElementById('photoTitle').value;
            const url = document.getElementById('photoUrl').value;
            let photos = JSON.parse(localStorage.getItem('uyghur_app_photos')) || [];
            photos.unshift({ id: Date.now(), title, url });
            localStorage.setItem('uyghur_app_photos', JSON.stringify(photos));
            document.getElementById('addPhotoForm').reset();
            
            renderGallery();
            alert('رەسىم مۇۋەپپەقىيەتلىك يوللاندى ۋە رەسىملەر بەتىگە قوشۇلدى!');
            switchView('galleryView', document.querySelectorAll('.nav-item')[2]);
        }

        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            if (!container) return;
            let photos = JSON.parse(localStorage.getItem('uyghur_app_photos')) || [];
            container.innerHTML = photos.map(p => `
                <div class="gallery-card">
                    <img src="${p.url}" alt="${p.title}">
                    <div class="gallery-card-title">${p.title}</div>
                </div>
            `).join('');
        }

        function switchView(viewId, navElement) {
            if (viewId === 'adminView' && String(currentUser?.id) !== String(ADMIN_TELEGRAM_ID)) {
                alert('ھوقۇقىڭىز يوق!'); return;
            }
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (navElement) navElement.classList.add('active');

            if (viewId === 'adminView') renderAdminUserList();
            if (viewId === 'galleryView') renderGallery();
            if (viewId === 'homeView') renderHomeMovies();
            if (viewId === 'chatView') renderChatMessages();
        }

        function getMovies() {
            return JSON.parse(localStorage.getItem('uyghur_movies')) || [
                { id: 1001, title: "ئالەم ئارا ساياھەت", poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80", archiveUrl: "https://archive.org/embed/Popeye_for_President", type: "free" }
            ];
        }

        function renderHomeMovies() {
            const container = document.getElementById('homeMovieList');
            if (!container) return;
            const movies = getMovies();
            container.innerHTML = movies.map(m => `
                <div class="movie-card" onclick="playMovie('${m.title}', '${m.archiveUrl}', '${m.type}')">
                    <div class="${m.type === 'vip' ? 'movie-badge-vip' : 'movie-badge-free'}">${m.type === 'vip' ? '👑 VIP' : 'ھەقسىز'}</div>
                    <img src="${m.poster}" alt="${m.title}">
                    <div class="movie-card-info"><div class="movie-card-title">${m.title}</div></div>
                </div>
            `).join('');
        }

        function renderAdminUserList() {
            const container = document.getElementById('registeredUsersContainer');
            if (!container) return;
            let users = JSON.parse(localStorage.getItem('uyghur_tg_users')) || [];
            const countEl = document.getElementById('userCount');
            if(countEl) countEl.innerText = users.length;
            
            container.innerHTML = users.map(u => {
                const vip = isUserVip(u.id);
                return `
                    <div class="user-item-card">
                        ${u.photo_url ? `<img src="${u.photo_url}" class="user-item-avatar">` : `<div class="user-item-placeholder">${u.name.charAt(0)}</div>`}
                        <div class="user-item-info"><strong>${u.name} ${vip ? '👑' : ''}</strong><span>@${u.username || 'yوق'}</span></div>
                        <button class="btn-vip-toggle" onclick="toggleUserVipStatus('${u.id}')">${vip ? 'VIP ئۆچۈرۈش' : 'VIP قىلىش'}</button>
                    </div>
                `;
            }).join('');
        }

        function saveMovie(e) {
            e.preventDefault();
            const title = document.getElementById('movieTitle').value;
            const poster = document.getElementById('moviePoster').value;
            let archiveUrl = document.getElementById('movieArchiveUrl').value;
            const type = document.getElementById('movieType').value;

            if (archiveUrl.includes('/details/')) archiveUrl = archiveUrl.replace('/details/', '/embed/');

            let movies = getMovies();
            const id = Date.now();
            movies.unshift({ id, title, poster, archiveUrl, type });
            localStorage.setItem('uyghur_movies', JSON.stringify(movies));
            document.getElementById('addMovieForm').reset();
            
            renderHomeMovies();
            alert('فىلىم مۇۋەپپەقىيەتلىك توربەتكە يوللاندى ھەممە ئادەمگە كۆرۈندى!');
            switchView('homeView', document.querySelectorAll('.nav-item')[0]);
        }

        function playMovie(title, url, type) {
            if (type === 'vip' && !isUserVip(currentUser?.id)) {
                alert('بۇ VIP فىلىم! كۆرۈش ئۈچۈن سىزدە VIP سالاھىيىتى بولۇشى كېرەك.');
                return;
            }
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('playerContainer').innerHTML = `<iframe src="${url}" allowfullscreen></iframe>`;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closeVideo() {
            document.getElementById('playerContainer').innerHTML = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const movies = getMovies();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(query));
            document.getElementById('searchMovieList').innerHTML = filtered.map(m => `
                <div class="movie-card" onclick="playMovie('${m.title}', '${m.archiveUrl}', '${m.type}')">
                    <div class="${m.type === 'vip' ? 'movie-badge-vip' : 'movie-badge-free'}">${m.type === 'vip' ? '👑 VIP' : 'ھەقسىز'}</div>
                    <img src="${m.poster}" alt="${m.title}">
                    <div class="movie-card-info"><div class="movie-card-title">${m.title}</div></div>
                </div>
            `).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
