<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ئۇيغۇر كىنو ئەپ</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #e50914;
            --bg-color: #0f0f0f;
            --card-bg: #1c1c1e;
            --text-color: #ffffff;
            --text-muted: #8e8e93;
            --nav-bg: #161618;
            --border-color: #2c2c2e;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            padding-bottom: 70px; /* Space for bottom navigation */
            user-select: none;
        }

        /* App Top Bar */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* View Sections (Single Page App) */
        .app-view {
            display: none;
            padding: 16px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .app-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Movie Section Title */
        .section-header {
            font-size: 16px;
            font-weight: 700;
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Movie Grid (Mobile UI) */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .movie-card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            display: block;
        }

        .movie-card-info {
            padding: 8px;
        }

        .movie-card-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Form Controls (Admin View) */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Bottom Mobile Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
            width: 25%;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        /* Fullscreen Player Modal */
        .player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
        }

        .player-header {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.8);
        }

        .player-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .player-body iframe, .player-body video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-close {
            color: #fff;
            font-size: 20px;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- App Header Bar -->
    <div class="app-header">
        <div class="app-title">
            <i class="fa-solid fa-play-circle"></i> ئۇيغۇر كىنو
        </div>
        <div>
            <i class="fa-regular fa-bell" style="font-size: 18px;"></i>
        </div>
    </div>

    <!-- 1. Home View -->
    <div id="homeView" class="app-view active">
        <div class="section-header">
            <span>يېڭى قوشۇلغان فىلىملەر</span>
        </div>
        <div class="movie-grid" id="homeMovieList"></div>
    </div>

    <!-- 2. Search View -->
    <div id="searchView" class="app-view">
        <div class="form-group">
            <input type="text" id="searchInput" class="form-control" placeholder="كىنو ئىسمىنى ئىزدەڭ..." onkeyup="handleSearch()">
        </div>
        <div class="movie-grid" id="searchMovieList"></div>
    </div>

    <!-- 3. Admin Panel View -->
    <div id="adminView" class="app-view">
        <div class="section-header">
            <span>باشقۇرغۇچى: يېڭى فىلىم قوشۇش</span>
        </div>
        <form id="addMovieForm" onsubmit="saveMovie(event)">
            <div class="form-group">
                <label>فىلىم ئىسمى</label>
                <input type="text" id="movieTitle" class="form-control" placeholder="مەسئۇلىيەتچان كىنو" required>
            </div>
            <div class="form-group">
                <label>فىلىم رەسىمى (Image URL / Poster)</label>
                <input type="url" id="moviePoster" class="form-control" placeholder="https://example.com/poster.jpg" required>
            </div>
            <div class="form-group">
                <label>Archive.org ئۇلانمىسى (Archive Video URL)</label>
                <input type="url" id="movieArchiveUrl" class="form-control" placeholder="https://archive.org/details/..." required>
            </div>
            <div class="form-group">
                <label>ئېلان قىلىنغان يىلى</label>
                <input type="number" id="movieYear" class="form-control" placeholder="2024" value="2024">
            </div>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-cloud-arrow-up"></i> فىلىمنى ئېلان قىلىش
            </button>
        </form>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('homeView', this)">
            <i class="fa-solid fa-house"></i>
            <span>ئاساسىي</span>
        </div>
        <div class="nav-item" onclick="switchView('searchView', this)">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>ئىزدەش</span>
        </div>
        <div class="nav-item" onclick="switchView('adminView', this)">
            <i class="fa-solid fa-plus-circle"></i>
            <span>باشقۇرۇش</span>
        </div>
    </div>

    <!-- Video Player Screen (Modal) -->
    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span id="playerTitle" style="font-size: 14px; font-weight: 600;"></span>
            <button class="btn-close" onclick="closeVideo()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="player-body" id="playerContainer">
            <!-- Dynamic Iframe / Video element -->
        </div>
    </div>

    <script>
        // Default Sample Data with Archive.org format support
        const defaultMovies = [
            {
                id: 1,
                title: "ئالەم ئارا ساياھەت",
                poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80",
                archiveUrl: "https://archive.org/details/Popeye_for_President",
                year: "2023"
            }
        ];

        // Retrieve saved movies or initialize with default
        function getMovies() {
            const saved = localStorage.getItem('uyghur_movies');
            return saved ? JSON.parse(saved) : defaultMovies;
        }

        // Switch Navigation Views
        function switchView(viewId, navElement) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');
            if(navElement) navElement.classList.add('active');

            if(viewId === 'homeView') renderHomeMovies();
        }

        // Render Home View Movies
        function renderHomeMovies() {
            const movies = getMovies();
            const container = document.getElementById('homeMovieList');
            container.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.title, movie.archiveUrl);
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                        <div class="movie-card-meta">
                            <span>${movie.year}</span>
                            <span style="color:#ffd700;"><i class="fa-solid fa-star"></i> HD</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Save New Movie (Admin Action)
        function saveMovie(e) {
            e.preventDefault();
            const title = document.getElementById('movieTitle').value;
            const poster = document.getElementById('moviePoster').value;
            let archiveUrl = document.getElementById('movieArchiveUrl').value;
            const year = document.getElementById('movieYear').value;

            // Archive.org Embed URL converter helper
            if(archiveUrl.includes('archive.org/details/')) {
                archiveUrl = archiveUrl.replace('/details/', '/embed/');
            }

            const newMovie = { id: Date.now(), title, poster, archiveUrl, year };
            const movies = getMovies();
            movies.unshift(newMovie);

            localStorage.setItem('uyghur_movies', JSON.stringify(movies));
            
            document.getElementById('addMovieForm').reset();
            alert('فىلىم مۇۋەپپەقىيەتلىك ئېلان قىلىندى!');
            switchView('homeView', document.querySelectorAll('.nav-item')[0]);
        }

        // Handle Search
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const movies = getMovies();
            const filtered = movies.filter(m => m.title.toLowerCase().includes(query));
            
            const container = document.getElementById('searchMovieList');
            container.innerHTML = '';

            filtered.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.title, movie.archiveUrl);
                card.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}">
                    <div class="movie-card-info">
                        <div class="movie-card-title">${movie.title}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Video Player Launch
        function playMovie(title, url) {
            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            document.getElementById('playerTitle').innerText = title;

            // If Archive.org Details Link convert to embed
            let embedUrl = url;
            if(embedUrl.includes('archive.org/details/')) {
                embedUrl = embedUrl.replace('/details/', '/embed/');
            }

            container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            modal.style.display = 'flex';
        }

        function closeVideo() {
            const modal = document.getElementById('playerModal');
            const container = document.getElementById('playerContainer');
            container.innerHTML = '';
            modal.style.display = 'none';
        }

        // Initialize App
        window.onload = function() {
            renderHomeMovies();
        };
    </script>
</body>
</html>
